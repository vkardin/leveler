name: Release

# Релиз создаётся сам, когда в main приходит новая версия в extension/manifest.json
# (релиза v<версия> ещё нет). Ещё можно запустить вручную (Actions → Release →
# Run workflow) или запушить метку v1.2.3; в этих двух случаях релиз той же
# версии пересобирается. Перед публикацией всегда проходят тесты.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0 (empty = from manifest.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          M=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="${INPUT:-$M}"; V="${V#v}"; fi
          P=true
          # push в main: только если релиза этой версии ещё нет
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "v$V" >/dev/null 2>&1; then P=false; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$P" >> "$GITHUB_OUTPUT"
          echo "Версия $V, публиковать: $P"

  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml

  release:
    needs: [plan, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Chrome and Firefox zips
        run: python3 tools/build.py extension dist --version "$VERSION"
      - name: Release notes from CHANGELOG.md
        run: |
          # раздел «## <версия>» до следующего «## »
          awk -v v="$VERSION" '$0 ~ "^## " { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Leveler $VERSION" > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # повторная сборка той же версии заменяет релиз и переносит метку на текущий коммит
          if gh release view "v$VERSION" >/dev/null 2>&1; then gh release delete "v$VERSION" --cleanup-tag -y; fi
          gh release create "v$VERSION" dist/*.zip --target "$GITHUB_SHA" --title "Leveler $VERSION" --notes-file notes.md
