name: "🐞 Ошибка / Помилка / Bug"
description: "Что-то работает не так · Щось працює не так · Something doesn't work"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "Что случилось? / Що сталося? / What happened?"
      description: "Что вы делали, что ожидали и что получилось. Скриншот очень помогает."
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: "Сайт / Site"
      placeholder: "https://www.youtube.com/watch?v=..."
  - type: input
    id: browser
    attributes:
      label: "Браузер и версия / Browser and version"
      placeholder: "Chrome 130, Firefox 132..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Версия Leveler / Leveler version"
      description: "Видна в chrome://extensions или about:addons."
      placeholder: "1.0.0"
