<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Leveler</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo"></span><b>Leveler</b></div>
    <label class="switch" data-i18n-title="p_enabled_title">
      <input type="checkbox" id="enabled"><span></span>
    </label>
  </header>

  <div class="status" id="status"><i></i><span id="statusText"></span></div>

  <div class="notice" id="notice" hidden>
    <b data-i18n="p_unsupported"></b>
    <span id="noticeText"></span>
    <button type="button" id="retry" class="link" data-i18n="p_retry" hidden></button>
  </div>

  <section class="card" id="presetCard">
    <div class="row">
      <label for="preset" data-i18n="p_preset"></label>
      <span class="scope"><span id="scope"></span><em id="modified" data-i18n="p_modified" hidden></em></span>
    </div>
    <div class="preset-row">
      <select id="preset"></select>
      <button type="button" class="icon" id="saveAs" data-i18n-title="p_save_as">&#65291;</button>
      <button type="button" class="icon" id="rename" data-i18n-title="p_rename">&#9998;</button>
      <button type="button" class="icon" id="remove" data-i18n-title="p_delete">&#10005;</button>
    </div>
    <form class="name-form" id="nameForm" hidden>
      <input type="text" id="nameInput" maxlength="40" autocomplete="off" required>
      <button type="submit" class="btn primary" data-i18n="p_ok"></button>
      <button type="button" class="btn" id="nameCancel" data-i18n="p_cancel"></button>
    </form>
    <div class="confirm" id="confirm" hidden>
      <span id="confirmText"></span>
      <button type="button" class="btn danger" id="confirmYes" data-i18n="p_delete"></button>
      <button type="button" class="btn" id="confirmNo" data-i18n="p_cancel"></button>
    </div>
    <div class="site-actions" id="siteActions">
      <button type="button" class="link" id="makeDefault" data-i18n="p_make_default"></button>
      <button type="button" class="link" id="resetSite" data-i18n="p_reset_site"></button>
    </div>
  </section>

  <section class="card" id="levelCard">
    <div class="row">
      <label for="level" data-i18n="p_level"></label>
      <output id="levelOut"></output>
    </div>
    <input type="range" id="level" min="0" max="100" step="1">
    <div class="hint" data-i18n="p_level_hint"></div>
    <div class="meters" id="meters">
      <div class="meter"><span data-i18n="m_before"></span><b><i id="mPre"></i></b></div>
      <div class="meter"><span data-i18n="m_after"></span><b><i id="mPost"></i></b></div>
    </div>
    <div class="hint mono" id="levelInfo"></div>
  </section>

  <details class="card fold" id="compCard">
    <summary data-i18n="p_compressor"></summary>
    <div class="sliders" id="compSliders"></div>
  </details>

  <details class="card fold" id="eqCard">
    <summary data-i18n="p_eq"></summary>
    <div class="sliders" id="eqSliders"></div>
  </details>

  <section class="card" id="speedCard">
    <div class="row">
      <label for="speed" data-i18n="p_speed"></label>
      <output id="speedOut"></output>
    </div>
    <input type="range" id="speed">
    <div class="chips" id="chips">
      <button type="button" data-speed="0.75">0.75</button>
      <button type="button" data-speed="1">1×</button>
      <button type="button" data-speed="1.25">1.25</button>
      <button type="button" data-speed="1.5">1.5</button>
      <button type="button" data-speed="2">2</button>
    </div>
  </section>

  <footer>
    <button type="button" class="link" id="openOptions" data-i18n="p_options"></button>
    <span id="version"></span>
  </footer>

  <script src="../shared/defaults.js"></script>
  <script src="../shared/presets.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
